# Jeux libres proposés dans le système « ports ». es-genconfig crée `<roms>/ports/<fichier>` pour chaque jeu disponible
# (sans écraser un fichier existant). Complété par ~/.config/esne/ports.yml.
#
# Deux formes:
#   command:     programme déjà installé sur le système (lanceur `exec <command>`)
#   portmaster:  jeu du catalogue PortMaster (https://github.com/PortsMaster/PortMaster-New), à télécharger avec
#                `es-genconfig --install-port <nom>`; `dir` = dossier du jeu dans le zip, `binary` = exécutable
#                (suffixe `.<arch>` ajouté), `title` = libellé pour --list-ports.
digger:
  file: Digger.sh
  title: Digger (jeu d'arcade libre, 0,5 Mo, GPL-2.0)
  portmaster: digger.zip
  dir: digger
  binary: digger
