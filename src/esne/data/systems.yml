# Systèmes connus d'ES-NE (manufacturer/release/hardware/theme/platform alimentent es_systems.cfg; theme et platform valent la clé par défaut). Chaque système liste ses émulateurs et leurs cores; le plus petit
# `priority` est le choix par défaut (100 si absent). Complété par ~/.config/esne/systems.yml.
nes:
  name: Nintendo Entertainment System
  manufacturer: Nintendo
  release: 1983
  hardware: console
  extensions: [.nes, .unf, .unif, .zip, .7z]
  emulators:
    libretro:
      fceumm: { priority: 1 }
      nestopia: {}
snes:
  name: Super Nintendo
  manufacturer: Nintendo
  release: 1990
  hardware: console
  extensions: [.sfc, .smc, .zip, .7z]
