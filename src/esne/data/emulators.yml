libretro:
  binary: [retroarch, "flatpak run org.libretro.RetroArch"]
  core_dirs: [/usr/lib/libretro, "~/.config/retroarch/cores"]
  info_dirs: [/usr/share/libretro/info, "~/.config/retroarch/cores"]

# Émulateurs autonomes (generators/standalone.py). Les arguments sont ceux du mode "plein écran, sans interface".
# Réglages propres à chaque émulateur (résolution, contrôles...): voir sa propre configuration pour l'instant.
dolphin:
  binary: [dolphin-emu, "flatpak run org.DolphinEmu.dolphin-emu"]
  args: [-b, -e, "{rom}"]
  package: dolphin-emu
pcsx2:
  binary: [pcsx2-qt, pcsx2, "~/.local/bin/[Pp][Cc][Ss][Xx]2*.AppImage", "~/Applications/[Pp][Cc][Ss][Xx]2*.AppImage", "flatpak run net.pcsx2.PCSX2"]
  args: [-batch, -fullscreen, --, "{rom}"]
  package: pcsx2
rpcs3:
  binary: [rpcs3, "~/.local/bin/[Rr][Pp][Cc][Ss]3*.AppImage", "~/Applications/[Rr][Pp][Cc][Ss]3*.AppImage", "flatpak run net.rpcs3.RPCS3"]
  args: [--no-gui, "{rom}"]
  package: rpcs3
cemu:
  binary: [cemu, Cemu, "~/.local/bin/Cemu*.AppImage", "~/Applications/Cemu*.AppImage", "flatpak run info.cemu.Cemu"]
  args: [-f, -g, "{rom}"]
  package: cemu
xemu:
  binary: [xemu, "~/.local/bin/[Xx]emu*.AppImage", "~/Applications/[Xx]emu*.AppImage", "flatpak run app.xemu.xemu"]
  args: [-full-screen, -dvd_path, "{rom}"]
  package: xemu
rmg:
  # RMG (Rosalie's Mupen GUI, N64): AppImage de github.com/Rosalie241/RMG/releases, paquet AUR `rmg` ou Flatpak.
  # -f plein écran, -n sans barre de menus, -q quitte RMG à la fin de la partie.
  binary: ["~/.local/bin/[Rr][Mm][Gg]*.AppImage", "~/Applications/[Rr][Mm][Gg]*.AppImage", rmg, "flatpak run com.github.Rosalie241.RMG"]
  args: [-f, -n, -q, "{rom}"]
  package: "RMG (AppImage dans ~/.local/bin, AUR rmg ou Flatpak)"
ppsspp:
  # PPSSPP (PSP): AppImage de ppsspp.org, paquet ppsspp ou Flatpak. --pause-menu-exit: « Quitter » dans le menu pause.
  binary: ["~/.local/bin/[Pp][Pp][Ss][Ss][Pp][Pp]*.AppImage", "~/Applications/[Pp][Pp][Ss][Ss][Pp][Pp]*.AppImage", PPSSPPSDL, ppsspp, "flatpak run org.ppsspp.PPSSPP"]
  args: [--fullscreen, --pause-menu-exit, "{rom}"]
  package: "PPSSPP (AppImage dans ~/.local/bin, paquet ppsspp ou Flatpak)"
xenia:
  # Xenia Canary (Xbox 360): pas de paquet officiel, AppImage du fork Linux natif (github.com/peerloomllc/xenia-canary/releases).
  # Les options de ligne de commande portent le nom de celles de ~/.local/share/Xenia/xenia-canary.config.toml (ex. [Display] fullscreen).
  binary: ["~/.local/bin/[Xx]enia*.AppImage", "~/Applications/[Xx]enia*.AppImage", xenia_canary, xenia]
  args: ["--fullscreen=true", "{rom}"]
  package: "l'AppImage Xenia Canary dans ~/.local/bin"
redream:
  # Redream (Dreamcast): archive Linux de redream.io, pas de paquet; le binaire peut être placé dans le PATH, ~/.local/bin ou ~/Applications.
  binary: [redream, "~/.local/bin/redream", "~/Applications/redream/redream", "~/Applications/redream", "~/redream/redream"]
  args: ["{rom}"]
  package: "Redream (redream.io, archive Linux dans ~/.local/bin)"
eden:
  binary: [eden, "~/.local/bin/[Ee]den*.AppImage", "~/Applications/[Ee]den*.AppImage", "flatpak run dev.eden_emu.eden"]
  args: [-f, -g, "{rom}"]
  package: eden
ryujinx:
  binary: [ryujinx, Ryujinx, "flatpak run io.github.ryubing.Ryujinx"]
  args: ["{rom}"]
  package: ryujinx
steam:
  binary: [steam, "flatpak run com.valvesoftware.Steam"]
  # le fichier .steam contient l'identifiant (appid) du jeu; esne-steam-run attend la fin de la partie (Steam rend la main tout de suite)
  prefix: [esne-steam-run, "{rom_text}", --]
  args: [-silent, "steam://rungameid/{rom_text}"]
  package: steam
wine:
  binary: [wine]
  args: ["{rom}"]
  cwd: rom_dir
  package: wine
umu:
  binary: [umu-run]
  args: ["{rom}"]
  env: {GAMEID: umu-0, PROTONPATH: GE-Proton}
  cwd: rom_dir
  package: umu-launcher
# Ports et jeux natifs: la « rom » est un script shell (voir ports.yml pour ceux que es-genconfig crée)
shell:
  binary: [sh]
  args: ["{rom}"]
  cwd: rom_dir
