[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esne"
version = "0.0.1"
description = "ES-NE: standalone EmulationStation launcher/configgen for Linux, no Batocera dependency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "evdev>=1.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
es-launcher = "esne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esne = ["data/*.yml"]
